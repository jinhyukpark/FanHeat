[project]
name = "fanheat-media-collector"
version = "0.1.0"
description = "FANHEAT external media collection service"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.13.5",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
]

[project.scripts]
media-collector = "media_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
