name: fanheat-automation

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - automation_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector-api:
    build:
      context: .
      dockerfile: services/media-collector/Dockerfile
    environment: &collector-env
      APP_ENV: local
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_RSS_FEEDS: ${NEWS_RSS_FEEDS:-}
      INTERNAL_API_KEY: ${FANHEAT_INTERNAL_API_KEY:?FANHEAT_INTERNAL_API_KEY is required}
      COLLECTOR_ADMIN_USER: ${COLLECTOR_ADMIN_USER:-${N8N_USER:-fanheat}}
      COLLECTOR_ADMIN_PASSWORD: ${COLLECTOR_ADMIN_PASSWORD:-${N8N_PASSWORD:?N8N_PASSWORD is required}}
      AI_WORKER_URL: http://ai-worker:8090
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/fanheat-full-pipeline
      N8N_X_WEBHOOK_URL: http://n8n:5678/webhook/fanheat-x-pipeline
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  collector-worker:
    build:
      context: .
      dockerfile: services/media-collector/Dockerfile
    command: celery -A media_collector.celery_app:celery_app worker -Q media-collection --loglevel=INFO
    environment: *collector-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.7
    profiles: ["container-ollama"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.11.7
    profiles: ["container-ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama", "pull"]
    command: ["${OLLAMA_MODEL:-qwen3:8b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      INTERNAL_API_KEY: ${FANHEAT_INTERNAL_API_KEY:?FANHEAT_INTERNAL_API_KEY is required}
      PIPELINE_BATCH_SIZE: 5
      PROMPT_VERSION: fanheat-v1
      AUTO_APPROVE_LOW_RISK: ${AUTO_APPROVE_LOW_RISK:-true}
      COMMENT_MIN_DELAY_MINUTES: ${COMMENT_MIN_DELAY_MINUTES:-5}
      COMMENT_MAX_DELAY_MINUTES: ${COMMENT_MAX_DELAY_MINUTES:-30}
    ports:
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.107.4
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-fanheat}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?N8N_PASSWORD is required}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      DB_SQLITE_POOL_SIZE: "2"
      FANHEAT_INTERNAL_API_KEY: ${FANHEAT_INTERNAL_API_KEY:?FANHEAT_INTERNAL_API_KEY is required}
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n:/files:ro
    depends_on:
      - collector-api
      - ai-worker
    restart: unless-stopped

volumes:
  automation_redis:
  ollama_models:
  n8n_data:
